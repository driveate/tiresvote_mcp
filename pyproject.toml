[project]
name = "tiresvote-mcp"
version = "0.1.0"
description = "MCP server for the TiresVote tire catalog and professional tire tests (Tires API)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "WHEEL SIZE KZ LLP", email = "info@wheel-size.com" },
]
keywords = ["mcp", "fastmcp", "tiresvote", "tires", "wheel-size"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=4.0.5,<5",
    "httpx>=0.28,<0.29",
]

[project.urls]
Homepage = "https://www.tiresvote.com"
"API Reference" = "https://api.wheel-size.com/v2/tires/swagger/"

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.4,<2",
    "respx>=0.23,<0.24",
    "ruff>=0.16.6",
]

[project.scripts]
tiresvote-mcp = "tiresvote_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiresvote_mcp"]

[tool.uv]
# Resolution caps: keep the lockfile on releases that have had time to be
# vetted (several newer releases were published within the last ~7 days).
# Raise a cap deliberately after reviewing the newer release.
constraint-dependencies = [
    "fastmcp<4.0.6",
    "ruff<0.16.9",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require the live Tires API (network access)",
]
